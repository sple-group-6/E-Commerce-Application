services:
  db:
    image: postgres:latest
    container_name: ecommerce_db
    environment:
      POSTGRES_DB: ecommerceappdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
